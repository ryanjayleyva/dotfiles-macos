version: 1
git_protocol: ssh
editor: nvim
prompt: enabled
prefer_editor_prompt: disabled
expiring_credentials: disabled
pager:
aliases:
  co: pr checkout
  prs: pr list
  myprs: pr list --author @me
  review: pr list --search "review-requested:@me"
  issues: issue list
  myissues: issue list --assignee @me
  repo: repo view
  pv: pr view
http_unix_socket:
browser:
clipboard: enabled
color_labels: enabled
accessible_colors: enabled
accessible_prompter: enabled
spinner: disabled
